# Version du plugin
pluginVersion=0.2.0

# API Paper ciblée. Le serveur CleanGang tourne en Paper 26.3.
# Si Gradle ne trouve pas cette version, regarde la liste exacte sur
# https://repo.papermc.io/#browse/browse:maven-public:io%2Fpapermc%2Fpaper%2Fpaper-api
# et remplace la valeur (ex. 26.3.1.build.+).
paperApiVersion=26.3.build.+

# api-version écrit dans plugin.yml (version minimale acceptée par le serveur)
pluginApiVersion=26.1

# Minecraft 26.x demande Java 25
javaVersion=25

org.gradle.jvmargs=-Xmx1g
